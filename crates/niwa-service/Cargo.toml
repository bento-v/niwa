[package]
name = "niwa-service"
description = "The background service that keeps Niwa's Strict sessions blocking"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
niwa-blocker = { path = "../niwa-blocker" }
niwa-core = { path = "../niwa-core" }
serde_json = "1"
windows-service = "0.8"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
]
